# Release or roll back a model (design doc F5): runs when a change to
# configs/releases/{dataset}.yaml merges to main. For each changed file it
# starts the model-release state machine and waits for it, so this commit's
# check shows whether the release worked. The worker must be on: the export
# job runs on it. Re-running a failed run starts a new execution.
#
# Needs the repository variable AWS_ROLE_ARN (stack output GithubActionsRoleArn).
name: release

on:
  push:
    branches: [main]
    paths: ["configs/releases/**"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run al check-release
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2
          role-duration-seconds: 23400
      - name: Start and wait for model-release
        env:
          BEFORE: ${{ github.event.before }}
          RELEASED_BY: ${{ github.actor }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- 'configs/releases/*.yaml')
          else
            files=$(ls configs/releases/*.yaml 2>/dev/null || true)
          fi
          if [ -z "$files" ]; then
            echo "No release file added or changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          machine=$(aws ssm get-parameter --name /leaf-al/state-machines/model-release \
            --query Parameter.Value --output text)
          executions=()
          for file in $files; do
            dataset=$(basename "$file" .yaml)
            input=$(uv run al release-input "$file" --released-by "$RELEASED_BY" --commit-sha "$GITHUB_SHA")
            name="${GITHUB_SHA:0:12}-${dataset}-${ATTEMPT}"
            arn=$(aws stepfunctions start-execution --state-machine-arn "$machine" \
              --name "$name" --input "$input" --query executionArn --output text)
            echo "Started $name for $file"
            executions+=("$arn")
          done
          failed=0
          for arn in "${executions[@]}"; do
            while status=$(aws stepfunctions describe-execution --execution-arn "$arn" \
                --query status --output text) && [ "$status" = RUNNING ]; do
              sleep 30
            done
            echo "- \`${arn##*:}\`: $status" >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" != SUCCEEDED ]; then
              aws stepfunctions describe-execution --execution-arn "$arn" \
                --query '{error: error, cause: cause}'
              failed=1
            fi
          done
          exit $failed
