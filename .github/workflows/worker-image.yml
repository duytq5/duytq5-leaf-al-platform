# Build the worker image for every commit on main and push it to GHCR as
# ghcr.io/duytq5/duytq5-leaf-al-platform-worker:{sha}. The ops repo
# (duytq5/active-learning-operation) pins a platform commit in platform.yaml;
# its rounds run every train, score and export job in that commit's image.
# A PR that changes the image's inputs builds it without pushing. Run it by
# hand (workflow_dispatch) to rebuild a commit whose build failed.
name: worker-image

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - worker/Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - .github/workflows/worker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: worker-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # torch with CUDA makes a multi-GB image; the runner's preinstalled
      # SDKs leave too little disk for it.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/duytq5/duytq5-leaf-al-platform-worker:${{ github.sha }}
      - name: Summary
        if: github.event_name != 'pull_request'
        run: echo "Pushed \`ghcr.io/duytq5/duytq5-leaf-al-platform-worker:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
