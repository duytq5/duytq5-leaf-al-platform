# RoCoLe (coffee leaves). Seed with: uv run al seed configs/datasets/rocole.yaml <image-dir>
# <image-dir> has one sub-folder per class, named exactly as the class code.
# The class order is the model's output order; never reorder after seeding.
# code: machine name (code, model, manifest, API); display_name: what people read.
name: rocole
classes:
  - {code: healthy, display_name: Healthy}
  - {code: red_spider_mite, display_name: Red spider mite}
  - {code: rust, display_name: Coffee leaf rust}
# Fixed at seeding, stratified per class. Test images never enter the AL pool.
split: {val: 0.15, test: 0.15, seed: 42}
