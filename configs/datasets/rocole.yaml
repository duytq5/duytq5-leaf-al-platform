# RoCoLe (coffee leaves). Seed with: uv run al seed configs/datasets/rocole.yaml <image-dir>
# <image-dir> has one sub-folder per label, named exactly as below.
# The label order is the model's output order; never reorder after seeding.
name: rocole
labels: [healthy, red_spider_mite, rust]
# Fixed at seeding, stratified per class. Test images never enter the AL pool.
split: {val: 0.15, test: 0.15, seed: 42}
