[project]
name = "leaf-al-platform"
version = "0.1.0"
description = "POC active-learning MLOps platform for leaf-disease image classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # crt lets boto3 use `aws login` credentials (the operator's Mac).
    "boto3[crt]>=1.34",
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
    # Manifests, pool lists and scores are Parquet (worker and round Lambdas).
    "pyarrow>=17",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
al = "cli.main:main"

[project.optional-dependencies]
# Inside the worker image (worker/Dockerfile): train, score and export jobs.
# The locked torch wheel bundles CUDA 13, which the RTX 5070 needs (12.8+).
worker = [
    "boto3>=1.34",
    "mlflow>=3.0",
    # Export: torch.onnx writes the model, onnxruntime checks it against torch.
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.2",
    "pillow>=11",
    "timm>=1.0",
    "torch>=2.7",
]
lambdas = [
    "boto3>=1.34",
    # Upload validation: decode, orient and re-encode app images.
    "pillow>=11",
]
# Edge/Admin API (FastAPI on Lambda). infra/lambda_code.py bundles the
# versions in uv.lock.
api = [
    "fastapi>=0.115",
    "mangum>=0.19",
]
infra = [
    "aws-cdk-lib>=2.150",
    "constructs>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "cli", "common", "db", "recipes", "selection", "worker", "lambdas", "infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
