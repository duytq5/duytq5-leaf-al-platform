[project]
name = "leaf-al-platform"
version = "0.1.0"
description = "POC active-learning MLOps platform for leaf-disease image classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Local RTX 5070 worker. Install torch from the CUDA 12.8 index on the GPU box
# (see worker/README.md); the default wheel is fine for CPU-only tests.
worker = [
    "boto3>=1.34",
    "mlflow>=3.0",
    "timm>=1.0",
    "torch>=2.7",
]
lambdas = [
    "boto3>=1.34",
]
infra = [
    "aws-cdk-lib>=2.150",
    "constructs>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "selection", "worker", "lambdas", "infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
