# Runs on the single EC2 instance: Postgres (metadata, MLflow and Label Studio
# databases), MLflow, and Label Studio behind Caddy (HTTPS) and oauth2-proxy
# (Cognito sign-in, groups labelers / admins only).
#
#   internet :443 -> caddy -> oauth2-proxy :4180 -> caddy :8081 (guard) -> label-studio :8080
#   internet :443 -> caddy -> viewer-gate :4180 -> viewer-app :5151 (admins only)
#   internet :443 -> caddy -> mlflow-gate :4180 -> mlflow :5000 (admins only)
#   worker, owner -> SSM tunnel -> mlflow :5000
#   label step Lambdas (VPC) -> label-studio :8080 with the admin API token
#
# Secrets come from .env next to this file (gitignored). On EC2, write .env
# from SSM Parameter Store before `docker compose up -d`; see docs/aws-setup.md.
#
# Postgres accepts network clients only over TLS. The server certificate and
# key are in ./tls: write-env.sh puts them there from SSM on EC2; locally, run
# ./make-tls.sh once. Clients pin the CA that signed it (tls/ca.crt, SSM
# /leaf-al/postgres/tls-ca).
#
# All state lives under DATA_DIR. On EC2 that is a separate EBS volume mounted
# at /data that is kept when the instance is terminated, so a new instance can
# re-attach it and pick up where the old one stopped. MLflow artifacts are in S3.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/start.sh"]
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-al}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-al}
      MLFLOW_DB: ${MLFLOW_DB:-mlflow}
    volumes:
      - ${DATA_DIR:?set DATA_DIR in .env}/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/start.sh:/start.sh:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./tls:/tls:ro
    ports:
      # The security group has no inbound rules: clients come through the SSM
      # tunnel. How Lambdas reach it is decided with the first Lambda that
      # needs Postgres. TLS + a strong password (pg_hba.conf) either way.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    build: ./mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Instance role on EC2 provides S3 credentials; only the region is needed.
      AWS_DEFAULT_REGION: ${AWS_REGION:?set AWS_REGION in .env}
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql://${POSTGRES_USER:-al}:${POSTGRES_PASSWORD}@postgres:5432/${MLFLOW_DB:-mlflow}?sslmode=require
      # Clients (the worker) write artifacts straight to S3 with their own credentials.
      - --default-artifact-root=s3://${MODELS_BUCKET:?set MODELS_BUCKET in .env}/mlflow-artifacts
      - --no-serve-artifacts
      # MLflow 3 refuses unknown Host headers and cross-origin POSTs. Its
      # public name comes through mlflow-gate; the SSM tunnel arrives as
      # localhost:<local port>. Listing hosts drops MLflow's localhost
      # defaults, so the tunnel's names are listed here too.
      - --allowed-hosts=${MLFLOW_DOMAIN},localhost,localhost:*,127.0.0.1,127.0.0.1:*
      - --cors-allowed-origins=https://${MLFLOW_DOMAIN}
    ports:
      # The worker and the owner come through the SSM tunnel; people with a
      # browser come through Caddy and mlflow-gate.
      - "5000:5000"

  # Label Studio Community. The first start creates the admin account and its
  # API token from .env (the label step Lambdas use that token); open sign-up
  # is off, so labelers join through an invite link from the admin.
  label-studio:
    image: heartexlabs/label-studio:1.23.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["label-studio", "start", "--no-browser", "--enable-legacy-api-token"]
    environment:
      DJANGO_DB: default
      POSTGRE_HOST: postgres
      POSTGRE_PORT: "5432"
      POSTGRE_NAME: labelstudio
      POSTGRE_USER: ${POSTGRES_USER:-al}
      POSTGRE_PASSWORD: ${POSTGRES_PASSWORD}
      # pg_hba.conf rejects connections without TLS; libpq reads this.
      PGSSLMODE: require
      LABEL_STUDIO_HOST: https://${LS_DOMAIN:?set LS_DOMAIN in .env}
      CSRF_TRUSTED_ORIGINS: https://${LS_DOMAIN}
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"
      LABEL_STUDIO_USERNAME: ${LS_ADMIN_EMAIL:?set LS_ADMIN_EMAIL in .env}
      LABEL_STUDIO_PASSWORD: ${LS_ADMIN_PASSWORD:?set LS_ADMIN_PASSWORD in .env}
      LABEL_STUDIO_USER_TOKEN: ${LS_API_TOKEN:?set LS_API_TOKEN in .env}
      LABEL_STUDIO_ENABLE_LEGACY_API_TOKEN: "true"
      # The webhook Lambda answers within API Gateway's 30 s.
      WEBHOOK_TIMEOUT: "30"
      # S3 links of tasks are signed with the instance role (no keys here).
      AWS_DEFAULT_REGION: ${AWS_REGION}
    ports:
      # Only the Lambdas' security group may reach 8080; people come through Caddy.
      - "8080:8080"

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    restart: unless-stopped
    depends_on:
      - label-studio
    # Upstream is Caddy's internal guard (caddy/Caddyfile, :8081), not Label
    # Studio itself: Community has no roles, so the guard lets only the
    # `admins` group create, change or delete projects. No depends_on caddy:
    # caddy already depends on this service.
    # Who gets through: members of these Cognito groups, from any email domain.
    # Flags, not environment, for lists: a list in an environment variable is
    # split on spaces, not commas.
    command:
      - --allowed-group=labelers
      - --allowed-group=admins
      - --email-domain=*
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: Cognito
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OAUTH2_PROXY_OIDC_ISSUER_URL:?set it in .env}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:?set it in .env}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?set it in .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?set it in .env}
      OAUTH2_PROXY_REDIRECT_URL: https://${LS_DOMAIN}/oauth2/callback
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: cognito:groups
      OAUTH2_PROXY_UPSTREAMS: http://caddy:8081
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_PASS_HOST_HEADER: "true"
      # The guard reads the Cognito groups from X-Forwarded-Groups. These are
      # the defaults, written out because the guard depends on them: set the
      # header, and drop any value the browser sent under that name.
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SKIP_AUTH_STRIP_HEADERS: "true"

  # Image viewer (FiftyOne, open source): every image of every dataset with
  # its split, status, source, label, versions, a label from a running round
  # and the app's guess. Read only: rounds still start from GitHub.
  # viewer-sync copies raw/ images to DATA_DIR/viewer/media (FiftyOne shows
  # local files only) and refreshes the FiftyOne datasets from Postgres every
  # SYNC_MINUTES; viewer-app serves them; both keep the datasets in mongo.
  mongo:
    image: mongo:7.0.14
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 512m
    volumes:
      - ${DATA_DIR}/viewer/mongo:/data/db

  viewer-sync:
    build:
      context: ../..
      dockerfile: deploy/ec2/viewer/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    command: ["python", "-m", "viewer.main"]
    mem_limit: 512m
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-al}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-al}?sslmode=require
      DATA_BUCKET: ${DATA_BUCKET:?set DATA_BUCKET in .env}
      AWS_REGION: ${AWS_REGION}
      MEDIA_DIR: /media
      SYNC_MINUTES: "10"
      FIFTYONE_DATABASE_URI: mongodb://mongo:27017
    volumes:
      - ${DATA_DIR}/viewer/media:/media

  viewer-app:
    build:
      context: ../..
      dockerfile: deploy/ec2/viewer/Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    command: ["python", "-m", "fiftyone.server.main", "--address=0.0.0.0", "--port=5151"]
    mem_limit: 768m
    environment:
      FIFTYONE_DATABASE_URI: mongodb://mongo:27017
    volumes:
      - ${DATA_DIR}/viewer/media:/media:ro

  # The viewer has no login of its own: a second oauth2-proxy on the same
  # Cognito client lets only the admins group through.
  viewer-gate:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    restart: unless-stopped
    depends_on:
      - viewer-app
    command:
      - --allowed-group=admins
      - --email-domain=*
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: Cognito
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OAUTH2_PROXY_OIDC_ISSUER_URL:?set it in .env}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:?set it in .env}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?set it in .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?set it in .env}
      OAUTH2_PROXY_REDIRECT_URL: https://${VIEWER_DOMAIN}/oauth2/callback
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: cognito:groups
      OAUTH2_PROXY_UPSTREAMS: http://viewer-app:5151
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_PASS_HOST_HEADER: "true"

  # MLflow has no login of its own: a third oauth2-proxy on the same Cognito
  # client lets only the admins group through, so ML engineers review runs
  # in the browser without a tunnel.
  mlflow-gate:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    restart: unless-stopped
    depends_on:
      - mlflow
    command:
      - --allowed-group=admins
      - --email-domain=*
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: Cognito
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OAUTH2_PROXY_OIDC_ISSUER_URL:?set it in .env}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:?set it in .env}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?set it in .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?set it in .env}
      OAUTH2_PROXY_REDIRECT_URL: https://${MLFLOW_DOMAIN}/oauth2/callback
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: cognito:groups
      OAUTH2_PROXY_UPSTREAMS: http://mlflow:5000
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_PASS_HOST_HEADER: "true"

  # HTTPS with Let's Encrypt certificates for LS_DOMAIN, VIEWER_DOMAIN and
  # MLFLOW_DOMAIN (renewed by Caddy). It also serves the Label Studio guard on :8081, which
  # is not published: only oauth2-proxy calls it, over the compose network.
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      - oauth2-proxy
      - viewer-gate
      - mlflow-gate
    environment:
      LS_DOMAIN: ${LS_DOMAIN}
      VIEWER_DOMAIN: ${VIEWER_DOMAIN:?set VIEWER_DOMAIN in .env}
      MLFLOW_DOMAIN: ${MLFLOW_DOMAIN:?set MLFLOW_DOMAIN in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates survive restarts, so Let's Encrypt limits are never hit.
      - ${DATA_DIR}/caddy:/data
    ports:
      - "80:80"
      - "443:443"
