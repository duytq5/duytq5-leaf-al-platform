# Who may connect to Postgres, and how. First matching line wins.
# TYPE      DATABASE  USER  ADDRESS  METHOD
# Inside the container (healthcheck, pg_dumpall in backup-postgres.sh).
local       all       all            trust
# Every network client must use TLS and a password, including MLflow on the
# compose network: there is no address-based trust.
hostnossl   all       all   all      reject
hostssl     all       all   all      scram-sha-256
